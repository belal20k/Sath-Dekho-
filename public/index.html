<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sath-Dekho</title>
    <style>
        body { font-family: Arial, sans-serif; background: #222; color: white; margin: 0; padding: 20px; }
        .container { max-width: 1100px; margin: auto; display: flex; flex-direction: column; align-items: center; }
        .box { background: #333; padding: 20px; border-radius: 8px; margin-bottom: 20px; width: 100%; box-sizing: border-box; }
        .main-layout { display: flex; width: 100%; gap: 20px; margin-top: 20px; display: none; }
        .player-side { flex: 2; display: flex; flex-direction: column; align-items: center; }
        .chat-side { flex: 1; background: #2a2a2a; border-radius: 8px; padding: 15px; display: flex; flex-direction: column; height: 520px; }
        video, iframe { width: 100%; height: 405px; background: black; border: none; display: none; border-radius: 4px; }
        input, button { padding: 12px; margin: 5px; font-size: 16px; border-radius: 4px; border: none; }
        button { background: #28a745; color: white; cursor: pointer; font-weight: bold; }
        button:hover { background: #218838; }
        .chat-messages { flex: 1; overflow-y: auto; background: #1e1e1e; padding: 10px; border-radius: 4px; margin-bottom: 10px; text-align: left; }
        .msg { margin-bottom: 8px; padding: 6px 10px; border-radius: 4px; display: inline-block; clear: both; max-width: 85%; }
        .msg.me { background: #007bff; float: right; color: white; }
        .msg.friend { background: #444; float: left; color: white; }
        .room-info { font-size: 18px; color: #ffc107; font-weight: bold; margin-bottom: 10px; }
        .sharing-controls { background: #444; padding: 10px; border-radius: 6px; width: 100%; text-align: center; margin-bottom: 15px; box-sizing: border-box; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Sath-Dekho</h1>

        <!-- Connection Screen -->
        <div id="loginScreen" class="box" style="text-align: center;">
            <h3>Enter Room & Your Name to Connect</h3>
            <input type="text" id="nameInput" placeholder="Your Name (e.g., Belal)" style="width: 250px;"><br>
            <input type="text" id="roomInput" placeholder="Room Name (e.g., masti123)" style="width: 250px;"><br>
            <button onclick="joinRoom()">Connect / Join Room</button>
        </div>

        <!-- Main Layout -->
        <div id="mainLayout" class="main-layout">
            
            <!-- Left Side: Players & Controls -->
            <div class="player-side box">
                <div class="room-info" id="roomDisplay">Room: Connected</div>
                
                <!-- Screen Share Controls -->
                <div class="sharing-controls">
                    <button id="screenBtn" onclick="startScreenShare()" style="background: #17a2b8;">🖥️ Share Screen & Audio</button>
                    <span id="shareStatus" style="margin-left: 10px; font-size: 14px; color: #aaa;"></span>
                </div>

                <!-- YouTube Option -->
                <div style="width: 100%; border-bottom: 1px solid #555; padding-bottom: 15px; margin-bottom: 15px;">
                    <input type="text" id="ytUrl" placeholder="Paste YouTube Video Link here..." style="width: 60%;">
                    <button onclick="loadYouTube()">Load YouTube</button>
                </div>

                <!-- Local Video Option -->
                <div style="width: 100%; margin-bottom: 15px;">
                    <label>Or Choose Local Video: </label>
                    <input type="file" id="localFile" accept="video/*" onchange="loadLocalVideo()">
                </div>

                <!-- Media Players -->
                <video id="localPlayer" controls></video>
                <video id="screenPlayer" autoplay playsinline style="display: none;"></video>
                <div id="ytPlayer"></div>
            </div>

            <!-- Right Side: Chat -->
            <div class="chat-side">
                <h3>Live Chat</h3>
                <div class="chat-messages" id="chatBox"></div>
                <div style="display: flex;">
                    <input type="text" id="msgInput" placeholder="Type a message..." style="flex: 1; margin: 0; border-radius: 4px 0 0 4px;">
                    <button onclick="sendMessage()" style="margin: 0; border-radius: 0 4px 4px 0; background: #007bff;">Send</button>
                </div>
            </div>

        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="https://youtube.com"></script>

    <script>
        const socket = io();
        let currentRoom = '';
        let myName = '';
        const localPlayer = document.getElementById('localPlayer');
        const screenPlayer = document.getElementById('screenPlayer');
        let ytPlayer;
        let currentMode = ''; 
        let isSyncing = false;

        // WebRTC System for Screen Share
        let peerConnection;
        let localDisplayStream;
        const config = { iceServers: [{ urls: 'stun:://google.com' }] };

        function joinRoom() {
            const room = document.getElementById('roomInput').value.trim();
            const name = document.getElementById('nameInput').value.trim();
            if(!room || !name) return alert("Please enter both Name and Room Name");
            
            currentRoom = room;
            myName = name;
            socket.emit('join-room', currentRoom);
            
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('mainLayout').style.display = 'flex';
            document.getElementById('roomDisplay').innerText = `Connected as ${myName} | Room: ${currentRoom}`;
        }

        // SCREEN SHARE LOGIC
        async function startScreenShare() {
            try {
                // Captures Screen + Mic Audio together
                localDisplayStream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: true });
                
                try {
                    const audioStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    audioStream.getAudioTracks().forEach(track => localDisplayStream.addTrack(track));
                } catch(e) { console.log("Mic optional or denied, streaming screen audio only."); }

                currentMode = 'screen';
                localPlayer.style.display = 'none';
                document.getElementById('ytPlayer').style.display = 'none';
                if(ytPlayer && ytPlayer.stopVideo) ytPlayer.stopVideo();

                screenPlayer.srcObject = localDisplayStream;
                screenPlayer.style.display = 'block';
                screenPlayer.muted = true; // Prevents echo on owner's end

                document.getElementById('shareStatus').innerText = "Streaming your screen...";
                socket.emit('screen-share-ready', { room: currentRoom });
                initPeerConnection();
            } catch (err) {
                alert("Screen share cancelled or failed: " + err.message);
            }
        }

        function initPeerConnection() {
            peerConnection = new RTCPeerConnection(config);
            
            if (localDisplayStream) {
                localDisplayStream.getTracks().forEach(track => peerConnection.addTrack(track, localDisplayStream));
            }

            peerConnection.onicecandidate = (event) => {
                if (event.candidate) {
                    socket.emit('ice-candidate', { room: currentRoom, candidate: event.candidate });
                }
            };

            peerConnection.ontrack = (event) => {
                currentMode = 'screen';
                localPlayer.style.display = 'none';
                document.getElementById('ytPlayer').style.display = 'none';
                
                screenPlayer.srcObject = event.streams[0];
                screenPlayer.style.display = 'block';
                document.getElementById('shareStatus').innerText = "Watching friend's screen...";
            };
        }

        socket.on('screen-share-ready', async () => {
            initPeerConnection();
            const offer = await peerConnection.createOffer();
            await peerConnection.setLocalDescription(offer);
            socket.emit('voice-offer', { room: currentRoom, offer: offer });
        });

        socket.on('voice-offer', async (data) => {
            if (!peerConnection) initPeerConnection();
            await peerConnection.setRemoteDescription(new RTCSessionDescription(data.offer));
            const answer = await peerConnection.createAnswer();
            await peerConnection.setLocalDescription(answer);
            socket.emit('voice-answer', { room: currentRoom, answer: answer });
        });

        socket.on('voice-answer', async (data) => {
            await peerConnection.setRemoteDescription(new RTCSessionDescription(data.answer));
        });

        socket.on('ice-candidate', async (data) => {
            try {
                if (peerConnection) await peerConnection.addIceCandidate(new RTCIceCandidate(data.candidate));
            } catch (e) { console.error(e); }
        });

        // LOCAL VIDEO CODE
        function loadLocalVideo() {
            const fileInput = document.getElementById('localFile');
            if (!fileInput.files.length) return;
            
            currentMode = 'local';
            document.getElementById('ytPlayer').style.display = 'none';
            screenPlayer.style.display = 'none';
            if(ytPlayer && ytPlayer.stopVideo) ytPlayer.stopVideo();

            const fileURL = URL.createObjectURL(fileInput.files[0]);
            localPlayer.src = fileURL;
            localPlayer.style.display = 'block';
