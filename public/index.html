<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sath-Dekho</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background: #222; color: white; }
        .container { max-width: 800px; margin: auto; padding: 20px; }
        video, iframe { width: 100%; max-width: 720px; height: 405px; background: black; margin-top: 20px; border: none; display: none; }
        .controls { margin: 20px 0; padding: 10px; background: #333; border-radius: 8px; }
        input, button { padding: 10px; margin: 5px; font-size: 16px; border-radius: 4px; border: none; }
        button { background: #28a745; color: white; cursor: pointer; }
        button:hover { background: #218838; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Sath-Dekho (Sync Player)</h1>
        
        <div class="controls">
            <!-- YouTube Option -->
            <input type="text" id="ytUrl" placeholder="Paste YouTube Video Link here..." style="width: 60%;">
            <button onclick="loadYouTube()">Load YouTube</button>
            <br><br>
            <!-- Local Video Option -->
            <label for="localFile">Oooor Choose Local Video: </label>
            <input type="file" id="localFile" accept="video/*" onchange="loadLocalVideo()">
        </div>

        <!-- HTML5 Video Player for Local Files -->
        <video id="localPlayer" controls></video>
        
        <!-- YouTube Player Container -->
        <div id="ytPlayer"></div>
    </div>

    <!-- Socket.io Library -->
    <script src="/socket.io/socket.io.js"></script>
    <!-- YouTube Iframe API -->
    <script src="https://youtube.com"></script>

    <script>
        const socket = io();
        const localPlayer = document.getElementById('localPlayer');
        let ytPlayer;
        let currentMode = ''; // 'youtube' or 'local'
        let isSyncing = false;

        // 1. LOCAL VIDEO LOGIC
        function loadLocalVideo() {
            const fileInput = document.getElementById('localFile');
            const file = fileInput.files[0];
            if (!file) return;
            
            currentMode = 'local';
            document.getElementById('ytPlayer').style.display = 'none';
            if(ytPlayer && ytPlayer.stopVideo) ytPlayer.stopVideo();

            const fileURL = URL.createObjectURL(file);
            localPlayer.src = fileURL;
            localPlayer.style.display = 'block';
        }

        // Local Player Events to Sync
        localPlayer.onplay = () => {
            if (isSyncing) return;
            socket.emit('video-action', { mode: 'local', type: 'play', time: localPlayer.currentTime });
        };
        localPlayer.onpause = () => {
            if (isSyncing) return;
            socket.emit('video-action', { mode: 'local', type: 'pause', time: localPlayer.currentTime });
        };
        localPlayer.onseeking = () => {
            if (isSyncing) return;
            socket.emit('video-action', { mode: 'local', type: 'seek', time: localPlayer.currentTime });
        };

        // 2. YOUTUBE VIDEO LOGIC
        function onYouTubeIframeAPIReady() {
            ytPlayer = new YT.Player('ytPlayer', {
                height: '405', width: '720', videoId: '',
                events: { 'onStateChange': onPlayerStateChange }
            });
        }

        function loadYouTube() {
            const url = document.getElementById('ytUrl').value;
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = url.match(regExp);
            
            if (match && match[2].length == 11) {
                currentMode = 'youtube';
                localPlayer.style.display = 'none';
                localPlayer.pause();
                
                document.getElementById('ytPlayer').style.display = 'block';
                ytPlayer.loadVideoById(match[2]);
                
                socket.emit('video-action', { mode: 'youtube', type: 'load', videoId: match[2] });
            } else {
                alert("Please paste a valid YouTube URL");
            }
        }

        function onPlayerStateChange(event) {
            if (isSyncing || currentMode !== 'youtube') return;
            
            if (event.data == YT.PlayerState.PLAYING) {
                socket.emit('video-action', { mode: 'youtube', type: 'play', time: ytPlayer.getCurrentTime() });
            } else if (event.data == YT.PlayerState.PAUSED) {
                socket.emit('video-action', { mode: 'youtube', type: 'pause', time: ytPlayer.getCurrentTime() });
            }
        }

        // 3. RECEIVING SYNC SIGNALS FROM SERVER
        socket.on('video-action', (data) => {
            isSyncing = true; // Auto-loop rokne ke liye

            if (data.mode === 'local' && currentMode === 'local') {
                if (data.type === 'play') {
                    localPlayer.currentTime = data.time;
                    localPlayer.play();
                } else if (data.type === 'pause') {
                    localPlayer.pause();
                } else if (data.type === 'seek') {
                    localPlayer.currentTime = data.time;
                }
            } 
            
            else if (data.mode === 'youtube' && currentMode === 'youtube') {
                if (data.type === 'load') {
                    ytPlayer.loadVideoById(data.videoId);
                } else if (data.type === 'play') {
                    if (Math.abs(ytPlayer.getCurrentTime() - data.time) > 2) {
                        ytPlayer.seekTo(data.time, true);
                    }
                    ytPlayer.playVideo();
                } else if (data.type === 'pause') {
                    ytPlayer.pauseVideo();
                }
            }

            setTimeout(() => { isSyncing = false; }, 500);
        });
    </script>
</body>
</html>
