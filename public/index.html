<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sath-Dekho</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background: #222; color: white; margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: auto; }
        .box { background: #333; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
        video, iframe { width: 100%; max-width: 720px; height: 405px; background: black; margin-top: 20px; border: none; display: none; }
        input, button { padding: 12px; margin: 5px; font-size: 16px; border-radius: 4px; border: none; }
        button { background: #28a745; color: white; cursor: pointer; font-weight: bold; }
        button:hover { background: #218838; }
        .room-info { font-size: 18px; color: #ffc107; margin: 10px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Sath-Dekho</h1>

        <!-- Connection Screen (Purani wali) -->
        <div id="loginScreen" class="box">
            <h3>Enter Room to Connect with Friend</h3>
            <input type="text" id="roomInput" placeholder="Enter Room Name (e.g., masti123)">
            <button onclick="joinRoom()">Connect / Join Room</button>
        </div>

        <!-- Main Player Screen -->
        <div id="playerScreen" class="box" style="display: none;">
            <div class="room-info" id="roomDisplay">Room: Connected</div>
            
            <!-- Purana YouTube Link Option -->
            <div style="border-bottom: 1px solid #555; padding-bottom: 15px; margin-bottom: 15px;">
                <h4>Option 1: Paste YouTube Video Link</h4>
                <input type="text" id="ytUrl" placeholder="Paste YouTube Video Link here..." style="width: 60%;">
                <button onclick="loadYouTube()">Load YouTube</button>
            </div>

            <!-- Naya Local Video Option -->
            <div>
                <h4>Option 2: Choose Local Video (Must be same file for both)</h4>
                <input type="file" id="localFile" accept="video/*" onchange="loadLocalVideo()">
            </div>

            <!-- Players -->
            <video id="localPlayer" controls></video>
            <div id="ytPlayer"></div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="https://youtube.com"></script>

    <script>
        const socket = io();
        let currentRoom = '';
        const localPlayer = document.getElementById('localPlayer');
        let ytPlayer;
        let currentMode = ''; 
        let isSyncing = false;

        function joinRoom() {
            const room = document.getElementById('roomInput').value.trim();
            if(!room) return alert("Please enter a room name");
            
            currentRoom = room;
            socket.emit('join-room', currentRoom);
            
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('playerScreen').style.display = 'block';
            document.getElementById('roomDisplay').innerText = "Connected to Room: " + currentRoom;
        }

        // LOCAL VIDEO CODE
        function loadLocalVideo() {
            const fileInput = document.getElementById('localFile');
            if (!fileInput.files.length) return;
            
            currentMode = 'local';
            document.getElementById('ytPlayer').style.display = 'none';
            if(ytPlayer && ytPlayer.stopVideo) ytPlayer.stopVideo();

            const fileURL = URL.createObjectURL(fileInput.files[0]);
            localPlayer.src = fileURL;
            localPlayer.style.display = 'block';
            
            // Dost ki screen par bhi local player switch karne ke liye signal
            socket.emit('video-action', { room: currentRoom, mode: 'local', type: 'setup-local' });
        }

        localPlayer.onplay = () => {
            if (isSyncing) return;
            socket.emit('video-action', { room: currentRoom, mode: 'local', type: 'play', time: localPlayer.currentTime });
        };
        localPlayer.onpause = () => {
            if (isSyncing) return;
            socket.emit('video-action', { room: currentRoom, mode: 'local', type: 'pause', time: localPlayer.currentTime });
        };
        localPlayer.onseeking = () => {
            if (isSyncing) return;
            socket.emit('video-action', { room: currentRoom, mode: 'local', type: 'seek', time: localPlayer.currentTime });
        };

        // YOUTUBE CODE (Purana wala)
        function onYouTubeIframeAPIReady() {
            ytPlayer = new YT.Player('ytPlayer', {
                height: '405', width: '720', videoId: '',
                events: { 'onStateChange': onPlayerStateChange }
            });
        }

        function loadYouTube() {
            const url = document.getElementById('ytUrl').value;
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = url.match(regExp);
            
            if (match && match.length >= 2 && match[2].length == 11) {
                const videoId = match[2];
                currentMode = 'youtube';
                localPlayer.style.display = 'none';
                localPlayer.pause();
                
                document.getElementById('ytPlayer').style.display = 'block';
                ytPlayer.loadVideoById(videoId);
                
                socket.emit('video-action', { room: currentRoom, mode: 'youtube', type: 'load', videoId: videoId });
            } else {
                alert("Please paste a valid YouTube URL");
            }
        }

        function onPlayerStateChange(event) {
            if (isSyncing || currentMode !== 'youtube') return;
            if (event.data == YT.PlayerState.PLAYING) {
                socket.emit('video-action', { room: currentRoom, mode: 'youtube', type: 'play', time: ytPlayer.getCurrentTime() });
            } else if (event.data == YT.PlayerState.PAUSED) {
                socket.emit('video-action', { room: currentRoom, mode: 'youtube', type: 'pause', time: ytPlayer.getCurrentTime() });
            }
        }

        // SYNC RECEIVER
        socket.on('video-action', (data) => {
            isSyncing = true;
            
            if (data.mode === 'local') {
                if (data.type === 'setup-local') {
                    currentMode = 'local';
                    document.getElementById('ytPlayer').style.display = 'none';
                    if(ytPlayer && ytPlayer.stopVideo) ytPlayer.stopVideo();
                    localPlayer.style.display = 'block';
                    alert("Your friend chose a local video. Please choose the same video file from your computer to watch together!");
                }
                else if (currentMode === 'local') {
                    if (data.type === 'play') { localPlayer.currentTime = data.time; localPlayer.play(); }
                    else if (data.type === 'pause') { localPlayer.pause(); }
                    else if (data.type === 'seek') { localPlayer.currentTime = data.time; }
                }
            } 
            
            else if (data.mode === 'youtube') {
                if (data.type === 'load') {
                    currentMode = 'youtube';
                    localPlayer.style.display = 'none';
                    localPlayer.pause();
                    document.getElementById('ytPlayer').style.display = 'block';
                    ytPlayer.loadVideoById(data.videoId);
                }
                else if (data.type === 'play' && currentMode === 'youtube') {
                    if (Math.abs(ytPlayer.getCurrentTime() - data.time) > 2) ytPlayer.seekTo(data.time, true);
                    ytPlayer.playVideo();
                } else if (data.type === 'pause' && currentMode === 'youtube') {
                    ytPlayer.pauseVideo();
                }
            }
            setTimeout(() => { isSyncing = false; }, 500);
        });
    </script>
</body>
</html>
